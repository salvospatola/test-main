apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
      - name: ghcr-auth
      containers:
      - name: api
        image: ghcr.io/marcel/efg-nsu-portal:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
        env:
        - name: ENABLE_API
          value: "true"
        - name: ENABLE_WHATSAPP
          value: "false"
        - name: ENABLE_SCHEDULER
          value: "false"
        envFrom:
        - secretRef:
            name: api-secrets
        volumeMounts:
        - name: uploads-data
          mountPath: /app/uploads
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: uploads-data
        hostPath:
          path: /data/portal/uploads
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: prod
spec:
  type: NodePort
  selector:
    app: api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
    nodePort: 30000
