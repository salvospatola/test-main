services:
  mongodb:
    image: mongo:latest
    container_name: efg_nsu_mongodb
    restart: unless-stopped
    volumes:
      - efg_nsu_mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: efg_nsu_meilisearch
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - efg_nsu_meili_data:/meili_data
    ports:
      - "127.0.0.1:7700:7700"

  efg_nsu_portal_blue:
    build: .
    container_name: efg_nsu_portal_blue
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - mongodb
      - meilisearch
    environment:
      - PORT=3000
      - TZ=Europe/Berlin
      - UPLOADS_DIR=/app/uploads
      - SEARCH_ENGINE=meilisearch
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - BASE_URL=${BASE_URL}
      - APP_VERSION=${APP_VERSION:-}
      - APP_BUILD_ID=${APP_BUILD_ID:-}
    env_file:
      - .env
    volumes:
      - ./auth_info:/app/auth_info
      - efg_nsu_uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  efg_nsu_portal_green:
    build: .
    container_name: efg_nsu_portal_green
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - mongodb
      - meilisearch
    environment:
      - PORT=3000
      - TZ=Europe/Berlin
      - UPLOADS_DIR=/app/uploads
      - SEARCH_ENGINE=meilisearch
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - BASE_URL=${BASE_URL}
      - APP_VERSION=${APP_VERSION:-}
      - APP_BUILD_ID=${APP_BUILD_ID:-}
    env_file:
      - .env
    volumes:
      - ./auth_info:/app/auth_info
      - efg_nsu_uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  efg_nsu_mongo_data:
  efg_nsu_uploads_data:
  efg_nsu_meili_data:
